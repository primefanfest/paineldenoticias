name: Sincronizar escudos licenciados

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 1 * *"

permissions:
  contents: write

concurrency:
  group: sincronizar-escudos
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Baixar e catalogar pacotes
        env:
          ESCUDOSWEB_USUARIO: ${{ secrets.ESCUDOSWEB_USUARIO }}
          ESCUDOSWEB_SENHA: ${{ secrets.ESCUDOSWEB_SENHA }}
        run: npm run sync
      - name: Salvar alterações
        run: |
          git config user.name "newswall-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/escudos catalogo.json
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza catálogo de escudos"
          git push
